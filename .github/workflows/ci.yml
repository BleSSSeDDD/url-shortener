name: URL-Shortener CI

on:
  push:
    branches:
      - main
      - tests
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '**.txt'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
      - name: Download dependencies
        run: go mod download
      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test -v -race -cover -coverprofile=coverage.out ./...
      - name: Show coverage
        run: go tool cover -func=coverage.out

  health-check:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Create .env file
        run: cp .env.example .env
      - name: Build and run containers
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:80/health; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server did not become ready in time"
          exit 1
      - name: Show logs if failed
        if: failure()
        run: docker compose logs

  push-to-dockerhub:
    runs-on: ubuntu-latest
    needs: [health-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: blessseddd/url-shortener-server:latest