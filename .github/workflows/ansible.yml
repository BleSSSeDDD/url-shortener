# Separate pipeline for infrastructure code.
# ci.yml builds and tests Go and ignores changes under ansible/;
# this workflow reacts to those changes only.

name: Ansible Lint

on:
  push:
    branches:
      - main
      - tests
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install --quiet ansible-lint

      - name: Install collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint --profile production
