# CircleCI
# lint -> test -> e2e -> push to dockerhub
# ansible-lint runs independently of the Go pipeline.
#
# Secrets are set in Project Settings -> Environment Variables:
#   DOCKER_USERNAME, DOCKER_PASSWORD

version: 2.1

commands:
  # CircleCI has no built-in paths-ignore (only the paid path-filtering orb),
  # so changed files are inspected manually. When nothing outside docs and
  # ansible/ changed, the job is stopped with `circleci-agent step halt`,
  # which ends it as successful.
  skip_if_only_docs:
    steps:
      - run:
          name: Skip when only docs or ansible changed
          command: |
            if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
              echo "No previous commit - continuing"
              exit 0
            fi
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            if [ -z "$CHANGED" ]; then exit 0; fi
            echo "$CHANGED"
            if ! echo "$CHANGED" | grep -qvE '^(ansible/|docs/|.*\.md$|.*\.txt$)'; then
              echo "Only docs or ansible changed - skipping"
              circleci-agent step halt
            fi

  install_go:
    parameters:
      version:
        type: string
        default: "1.25.3"
    steps:
      - run:
          name: Install Go << parameters.version >>
          command: |
            curl -sSL "https://go.dev/dl/go<< parameters.version >>.linux-amd64.tar.gz" \
              | sudo tar -C /usr/local -xz
            echo 'export PATH=$PATH:/usr/local/go/bin' >> "$BASH_ENV"

jobs:
  lint:
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - skip_if_only_docs
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" latest
      - run:
          name: Run linter
          command: golangci-lint run --timeout=5m ./...

  test:
    docker:
      - image: cimg/go:1.25
    steps:
      - checkout
      - skip_if_only_docs
      - run:
          name: Download dependencies
          command: go mod download
      - run:
          name: Run tests
          command: go test -v -race -cover -coverprofile=coverage.out ./...
      - run:
          name: Show coverage
          command: go tool cover -func=coverage.out

  e2e:
    # machine, not docker: a real Docker daemon on the same host is required
    # so that localhost works, the same way it does in GitHub Actions.
    # With setup_remote_docker the daemon would live on a separate host.
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - skip_if_only_docs
      - install_go
      - run:
          name: Create .env
          command: cp .env.example .env
      - run:
          name: Build and start containers
          command: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - run:
          name: Wait for server
          command: |
            for i in $(seq 1 30); do
              if curl -s -f http://localhost:80/health; then
                echo "Server is ready"
                exit 0
              fi
              echo "Waiting for server... ($i/30)"
              sleep 2
            done
            echo "Server did not become ready in time"
            exit 1
      - run:
          name: Run e2e tests
          command: BASE_URL=http://localhost:80 go test -tags e2e -v ./test/e2e/...
      - run:
          name: Dump logs on failure
          when: on_fail
          command: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

  push-to-dockerhub:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Log in, build and push
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker build -t blessseddd/url-shortener-server:latest .
            docker push blessseddd/url-shortener-server:latest

  ansible-lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install ansible-lint
          command: pip install --quiet ansible-lint
      - run:
          name: Install collections
          command: cd ansible && ansible-galaxy collection install -r requirements.yml
      - run:
          name: Run ansible-lint
          command: cd ansible && ansible-lint --profile production

workflows:
  ci:
    jobs:
      - lint:
          filters:
            branches:
              only:
                - main
                - tests
      - test:
          filters:
            branches:
              only:
                - main
                - tests
      - e2e:
          requires:
            - lint
            - test
          filters:
            branches:
              only:
                - main
                - tests
      - push-to-dockerhub:
          requires:
            - e2e
          filters:
            branches:
              only: main
      - ansible-lint:
          filters:
            branches:
              only:
                - main
                - tests
